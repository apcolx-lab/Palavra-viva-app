<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palavra Viva</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#173a30">
  <style>
    :root {
      --bg-color: #f7f5ef;
      --text-color: #20332e;
      --card-bg: #ffffff;
      --primary: #205a48;
      --primary-hover: #174433;
      --accent: #b58a45;
      --font-size: 18px;
      --line-height: 1.6;
    }

    [data-theme="dark"] {
      --bg-color: #101b19;
      --text-color: #f4f3ec;
      --card-bg: #1c302a;
      --primary: #32735b;
      --primary-hover: #41886c;
      --accent: #f59e0b;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      font-size: var(--font-size);
      line-height: var(--line-height);
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--card-bg);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(156, 163, 175, 0.2);
    }

    .app-title {
      font-size: 1.25rem;
      font-weight: bold;
      margin: 0;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    button {
      min-width: 48px;
      min-height: 48px;
      padding: 8px 12px;
      font-size: 1rem;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button:hover, button:focus {
      background-color: var(--primary-hover);
      outline: 2px solid var(--accent);
    }

    main {
      flex: 1;
      padding: 16px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
    }

    .banner-update {
      background-color: var(--accent);
      color: #ffffff;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 6px;
      margin-bottom: 16px;
    }

    .nav-breadcrumb {
      margin-bottom: 16px;
      font-size: 0.95rem;
    }

    .nav-breadcrumb button {
      min-width: auto;
      min-height: 36px;
      padding: 4px 8px;
      margin-right: 8px;
    }

    .verse-item {
      margin-bottom: 12px;
      padding: 8px;
      border-radius: 4px;
    }

    .verse-num {
      font-weight: bold;
      color: var(--primary);
      margin-right: 8px;
    }

    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }

    .book-card {
      background-color: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      border: 1px solid rgba(156, 163, 175, 0.2);
    }

    footer {
      background-color: var(--card-bg);
      padding: 16px;
      text-align: center;
      font-size: 0.85rem;
      border-top: 1px solid rgba(156, 163, 175, 0.2);
      margin-top: auto;
    }

    .tab-content {
      display: block;
    }

    .tab-content:empty {
      display: none !important;
    }

    /* Leitura serena e responsiva: controles administrativos fora da passagem. */
    * { box-sizing: border-box; }
    header { background: var(--card-bg); padding: 14px max(16px, env(safe-area-inset-left)); gap: 12px; }
    .app-title { font-family: Georgia, 'Times New Roman', serif; font-size: 1.4rem; letter-spacing: -.025em; }
    .controls { align-items: center; flex-wrap: wrap; }
    header .controls button { padding: 8px; border-radius: 12px; font-size: .9rem; }
    main { max-width: 720px; padding: clamp(16px, 4vw, 32px); }
    .nav-breadcrumb { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--text-color); }
    .nav-breadcrumb button { min-height: 48px; padding: 8px 16px; margin: 0; }
    #reader-view h2 { font-family: Georgia, 'Times New Roman', serif; font-size: clamp(1.65rem, 6vw, 2.25rem); line-height: 1.25; margin: 20px 0 24px; }
    .verses-list { max-width: 66ch; }
    .verse-item { padding: 0 0 14px; margin: 0; line-height: 1.8; overflow-wrap: anywhere; }
    .verse-num { color: var(--accent); font-size: .8em; vertical-align: .1em; }
    .verse-text { font-family: Georgia, 'Times New Roman', serif; }
    .book-card { text-align: left; border-radius: 14px; min-height: 90px; }
    .book-card:focus-visible { outline: 3px solid var(--accent); }
    .teaching-box { border: 1px solid var(--accent); line-height: 1.65; }
    footer { overflow-wrap: anywhere; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); line-height: 1.6; }
    footer p { max-width: 720px; margin: 0 auto; }
    .settings-panel { margin: 32px 0 12px; border: 1px solid var(--accent); border-radius: 14px; padding: 14px; background: var(--card-bg); }
    .settings-panel summary { cursor: pointer; font-weight: 650; min-height: 48px; display: flex; align-items: center; }
    .settings-panel .controls { margin-top: 12px; }
    .settings-panel button { font-size: .9rem; padding: 10px 14px; }
    @media (max-width: 380px) { .app-title { font-size: 1.15rem; } header .controls { gap: 4px; } header .controls button { min-width: 44px; } }
    .storage-info {
      font-size: 0.85rem;
      margin-top: 12px;
      color: var(--text-color);
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <header>
    <h1 class="app-title">Palavra Viva</h1>
    <div class="controls">
      <button id="btn-font" aria-label="Alternar tamanho da fonte">A</button>
      <button id="btn-theme" aria-label="Alternar tema claro e escuro">🌓</button>
      
    </div>
  </header>

  <div id="update-banner" class="banner-update" style="display: none;">
    <span>Nova versão disponível!</span>
    <button id="btn-update">Atualizar</button>
  </div>

  <main id="app-container">
    <div id="nav-bar" class="nav-breadcrumb" style="display: none;">
      <button id="btn-back">← Voltar</button>
      <span id="nav-title"></span>
    </div>

    <!-- Dynamic Reader View -->
    <section id="reader-view"></section>

    <!-- IndexedDB Data Management / Backup -->
    <details id="storage-view" class="settings-panel"><summary>Configurações e cópia de segurança</summary>
      <div class="controls" style="gap: 12px; flex-wrap: wrap;">
        <button id="btn-export-backup">Exportar Backup JSON</button>
        <button id="btn-import-backup">Importar Backup JSON</button>
        <button id="btn-reset" aria-label="Limpar cache e dados locais">Limpar dados locais</button>
        <input type="file" id="file-backup-input" accept=".json" style="display: none;">
      </div>
      <div id="storage-estimate" class="storage-info"></div>
    </details>
  </main>

  <footer>
    <p id="license-attribution">Texto Bíblico: Bíblia Livre (CC BY 4.0 Brasil / porbr2018). Referências cruzadas: OpenBible.info (CC BY).</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
