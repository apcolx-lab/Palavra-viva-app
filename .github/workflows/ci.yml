name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Content
        run: node scripts/validate-content.mjs

      - name: Run Tests
        run: node --test tests/*.test.mjs
